name: Daily NSE Analysis -- 9:20 AM IST

on:
  schedule:
    - cron: "50 3 * * 1-5"
  workflow_dispatch:
    inputs:
      universe:
        description: "Stock Universe"
        required: false
        default: "Nifty 1000"

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pandas numpy yfinance requests beautifulsoup4 lxml pytz cachetools tenacity nselib httpx aiohttp

      - name: Run Full Analysis (Nifty 1000)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python scheduler.py --mode full --universe "Nifty 1000" --strategy "All Strategies"
